<!-- Top bar is only meaningful when logged in; show navigation dropdown, user + logout. -->
<header class="topbar">
  <div class="brand">
    <span class="logo-dot"></span>
    <span class="brand-text">Power BI + AI POC</span>
  </div>

  @if (currentUser(); as user) {
  <div class="user-area">
    <!-- Menu Navigation Dropdown -->
    <div class="nav-dropdown-wrapper">
      <span class="nav-icon">📌</span>
      <select
        class="nav-select"
        [value]="currentRoute()"
        (change)="onNavChange($event)"
        aria-label="Navigation Menu"
      >
        <option value="/dashboard">Home</option>
        <option value="/about-us">About Us</option>
        <option value="/gallery">Gallery</option>
        <option value="/documentation">Documentation</option>
      </select>
    </div>

    <span class="user-name">{{ user.name }}</span>
    <span class="user-id">({{ user.userId }})</span>
    <button class="btn-secondary" type="button" (click)="logout()">
      Logout
    </button>
  </div>
  }
</header>

<main class="content">
  <router-outlet />
</main>
